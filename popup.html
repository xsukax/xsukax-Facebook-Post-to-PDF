<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facebook Post PDF</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">f</span><div><strong>Facebook Post PDF</strong><small>Private · Works locally</small></div></header>
  <p>Open an individual Facebook post, then extract its content to create a PDF.</p>
  <button type="button" id="extract">Extract current post</button>
  <div id="status" role="status" aria-live="polite"></div>
  <p class="hint">For long posts, select <b>See more</b> on Facebook first. The extension never uploads post content.</p>
  <script src="popup.js"></script>
</body></html>
